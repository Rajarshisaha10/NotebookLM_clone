<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotebookLM AI</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Settings area -->
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon"><i class="fa-solid fa-book-open"></i></div>
                <h1>NotebookLM</h1>
            </div>
            
            <div class="sidebar-section">
                <h3>About</h3>
                <p>An AI assistant powered by Groq and LangChain. Ask questions about your loaded documents.</p>
            </div>
            
            <div class="sidebar-actions">
                <button id="clearBtn" class="btn btn-secondary">
                    <i class="fa-solid fa-trash-can"></i> Clear History
                </button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-container">
            <header class="chat-header">
                <h2>Chat Session</h2>
                <div class="status-indicator">
                    <span class="dot"></span> Online (Groq)
                </div>
            </header>

            <div class="chat-history" id="chatHistory">
                <!-- Welcome Message -->
                <div class="message ai-message">
                    <div class="avatar ai-avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="message-content">
                        <p>Hello! I am NotebookLM. Ask me anything about your documents.</p>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <form id="chatForm">
                    <div class="input-wrapper">
                        <textarea id="userInput" placeholder="Ask a question..." rows="1" required></textarea>
                        <button type="submit" id="sendBtn" class="btn btn-primary">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
